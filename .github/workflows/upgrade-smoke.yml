name: Upgrade smoke

# Weekly: the EmDash-on-Alchemy workarounds (packages/cloudflare-kit/src/emdash/alchemy-workarounds.ts)
# depend on Alchemy and EmDash internals. Build and smoke-test against their latest releases so a
# break shows up here before a Renovate PR lands.
on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Upgrade Alchemy and EmDash to latest
        run: bun scripts/ci/upgrade-latest.ts
      - name: Build
        run: bun run build
      - name: Local smoke test (alchemy dev, emulated resources)
        run: |
          bun run app -- reset
          bun run app -- smoke
