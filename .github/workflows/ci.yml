name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Re-runs the prod deploy for chosen sites (a failed deploy is not retried by a re-run
  # of an old push, and a fix outside `apps/<site>/` marks no site affected).
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites to deploy to prod, as a JSON array (e.g. ["jbolabs"])'
        required: true
        type: string

permissions:
  contents: read

env:
  # Turborepo remote cache on Cloudflare (stacks/turbo-cache.ts); unset means local cache only.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Unrelated labels must neither cancel preview validation nor skip the required check.
      group: affected-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && 'labels' || 'code' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      sites: ${{ steps.affected.outputs.sites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Affected sites
        id: affected
        # Assigned first so a failing script fails the step (inside `echo` it would pass an empty list on).
        run: |
          sites="$(bun scripts/ci/affected.ts "$BASE")"
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lint-test-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && 'labels' || 'code' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint
        run: bun run lint:ci
      - name: Typecheck and test (affected, cached)
        run: bunx turbo run typecheck test //#typecheck:root //#test:root --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # One runner per site: Lighthouse budgets stay free of CPU contention while sites run in parallel.
  verify:
    needs: affected
    if: needs.affected.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-${{ matrix.site }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && 'labels' || 'code' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.affected.outputs.sites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare local verification build inputs
        run: bun scripts/ci/local-verify.ts --prepare --sites "[\"$SITE\"]"
        env:
          SITE: ${{ matrix.site }}
      - name: Build (cached)
        run: bunx turbo run build --filter="@sites/$SITE"
        env:
          SITE: ${{ matrix.site }}
      # Miniflare supports Node; use its native runtime rather than Bun's subprocess emulation.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Required smoke, SEO and Lighthouse
        run: node scripts/ci/local-verify.ts --sites "[\"$SITE\"]"
        env:
          SITE: ${{ matrix.site }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-site-verification-${{ matrix.site }}
          path: .artifacts/ci/local-verification/
          if-no-files-found: ignore

  # The ruleset requires one `check` context; this gathers the parallel jobs into it.
  check:
    needs: [affected, lint-test, verify]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ needs.affected.outputs.sites }}
    steps:
      - name: Require every gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  dependency-review:
    # GitHub supports dependency review only on public repos or with Advanced Security;
    # on this private repo the action errors on every PR. Runs again if either changes.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  preview:
    needs: check
    # Fork PRs never get deploy credentials.
    # Deploy jobs skip until `stacks/github.ts` has created the environments and tokens.
    if: ${{ !cancelled() && needs.check.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview') && (github.event.action != 'labeled' || github.event.label.name == 'preview') && needs.check.outputs.sites != '[]' && vars.DEPLOYS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Recheck after acquiring the stage lock: queued events can outlive their label or head.
      - name: Check current preview request
        id: policy
        run: bun scripts/ci/preview-policy.ts >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Deploy affected sites
        if: steps.policy.outputs.deploy == 'true'
        run: bun scripts/ci/deploy.ts --stage "$STAGE" --sites '${{ needs.check.outputs.sites }}'
      - name: Comment preview URLs
        if: steps.policy.outputs.deploy == 'true'
        run: bun scripts/ci/comment.ts --pr ${{ github.event.pull_request.number }} --stage "$STAGE"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test and Lighthouse budgets
        if: steps.policy.outputs.deploy == 'true'
        run: bun scripts/ci/verify-previews.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preview-verification
          path: .artifacts/ci/
          if-no-files-found: ignore

  production:
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.sites != '[]') && vars.DEPLOYS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy affected sites to prod
        run: bun scripts/ci/deploy.ts --stage prod --sites "$SITES"
        env:
          SITES: ${{ github.event_name == 'workflow_dispatch' && inputs.sites || needs.check.outputs.sites }}
      - name: Verify production
        run: bun scripts/ci/verify-previews.ts --production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-verification
          path: .artifacts/ci/
          if-no-files-found: ignore
