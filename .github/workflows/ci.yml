name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Turborepo remote cache on Cloudflare (stacks/turbo-cache.ts); unset means local cache only.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      sites: ${{ steps.affected.outputs.sites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint
        run: bun run lint:ci
      - name: Typecheck, test, build (affected, cached)
        run: bunx turbo run typecheck test build //#typecheck:root //#test:root --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Affected sites
        id: affected
        # Assigned first so a failing script fails the step (inside `echo` it would pass an empty list on).
        run: |
          sites="$(bun scripts/ci/affected.ts "$BASE")"
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  dependency-review:
    # GitHub supports dependency review only on public repos or with Advanced Security;
    # on this private repo the action errors on every PR. Runs again if either changes.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  preview:
    needs: check
    # Fork PRs never get deploy credentials.
    # Deploy jobs skip until `stacks/github.ts` has created the environments and tokens.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.check.outputs.sites != '[]' && vars.DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy affected sites
        run: bun scripts/ci/deploy.ts --stage "$STAGE" --sites '${{ needs.check.outputs.sites }}'
      - name: Comment preview URLs
        run: bun scripts/ci/comment.ts --pr ${{ github.event.pull_request.number }} --stage "$STAGE"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test and Lighthouse budgets
        run: bun scripts/ci/verify-previews.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preview-verification
          path: .artifacts/ci/
          if-no-files-found: ignore

  production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.sites != '[]' && vars.DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      LEAD_NOTIFY_TO: ${{ vars.LEAD_NOTIFY_TO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy affected sites to prod
        run: bun scripts/ci/deploy.ts --stage prod --sites '${{ needs.check.outputs.sites }}'
      - name: Verify production
        run: bun scripts/ci/verify-previews.ts --production
