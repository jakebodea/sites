name: Preview cleanup

on:
  pull_request:
    types: [closed, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  destroy:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || github.event.label.name == 'preview') && vars.DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CMS_BOOTSTRAP_TOKEN: ${{ secrets.CMS_BOOTSTRAP_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Teardown runs main's code, never the closed PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      # A label can be re-added or the PR reopened while cleanup waits for the stage lock.
      - name: Check current preview request
        id: policy
        run: bun scripts/ci/preview-policy.ts >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - name: Destroy preview stage (deploy.ts refuses prod)
        if: steps.policy.outputs.destroy == 'true'
        run: bun scripts/ci/deploy.ts --destroy --stage pr-${{ github.event.pull_request.number }} --sites all
